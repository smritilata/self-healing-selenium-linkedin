# Self-Healing Automation Configuration

# Browser settings: chrome, firefox, edge
browser=chrome
headless=false
implicitWaitSeconds=5
explicitWaitSeconds=10
pageLoadTimeoutSeconds=30

# Self-Healing Engine Settings
healing.enabled=true
healing.similarity.threshold=0.60
healing.highlight.healed=true
healing.auto.update.repo=true
healing.screenshot.on.heal=true

# Storage and Reporting
healing.repo.path=src/main/resources/locators-repo.json
healing.report.output.dir=target/healing-reports

# LinkedIn Search Defaults
linkedin.url=https://www.linkedin.com/jobs/search/
linkedin.default.keyword=SDET
linkedin.default.location=Remote
linkedin.max.jobs.to.extract=8
